<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/pustaka/public

    <Directory /var/www/pustaka/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pustaka-error.log
    CustomLog ${APACHE_LOG_DIR}/pustaka-access.log combined
</VirtualHost>
